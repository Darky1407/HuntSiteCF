<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gibberish"></canvas>

    <div id="stage1Content">
      <p class="flavor">the first fragment is not written. it is placed.</p>

      <img id="stage1Image" src="stage1_image.png" alt="" />

      <div id="answerBlock">
        <input
          type="text"
          id="answerInput"
          placeholder="type the missing word"
          autocomplete="off"
        />
        <button id="submitBtn">confirm</button>
        <p id="feedback"></p>
      </div>

      <div id="riddleBlock" class="hidden">
        <p id="riddleText"></p>
        <button id="nextStageBtn">continue</button>
      </div>
    </div>

    <script src="matrix.js"></script>
    <script src="stage1.js"></script>
  </body>
</html>
