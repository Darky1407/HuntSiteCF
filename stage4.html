<!doctype html>
<html>
  <head>

    <title></title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="buttons.css" />
    <link rel="stylesheet" href="page-layouts.css" />

  <body>
    <canvas id="gibberish"></canvas>

    <div id="stage4Content">
      <p class="flavor">  Ordinary eyes were not built for this. Perhaps you need something other than eyes.</p>
      <img id="stage4Image" src="svsdvhxv.png" alt="" />

      <div id="answerBlock">
        <input
          type="text"
          id="answerInput"
          placeholder="enter the word"
          autocomplete="off"

      <div id="riddleBlock" class="hidden">
        <p id="riddleText"></p>
        <button id="nextStageBtn">continue</button>
      </div>
    </div>

    <script src="matrix.js"></script>
    <script src="stage4.js"></script>
