<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="buttons.css" />
    <link rel="stylesheet" href="page-layouts.css" />
    <link rel="stylesheet" href="stage-specific.css" />
  </head>
  <body>
    <canvas id="gibberish"></canvas>

    <div id="landingContent">
      <p class="flavor">It is finished. You were the one it was waiting for.</p>
      <p class="flavor small">Leave your name. Then tell it yourself.</p>

      <div id="nameBlock">
        <input
          type="text"
          id="nameInput"
          placeholder="your name"
          autocomplete="off"
        />
        <button id="nameSubmitBtn">confirm</button>
      </div>

      <p class="flavor small">
        Send a message here, so it knows you were real.
      </p>

      <a
        id="contactLink"
        href="https://www.instagram.com/dorkyborky14"
        target="_blank"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          width="36"
          height="36"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <p id="thanksMsg" class="hidden">It has been told.</p>
    </div>

    <script src="matrix.js"></script>
    <script src="landing.js"></script>
  </body>
</html>
